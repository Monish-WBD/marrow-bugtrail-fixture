# BugTrail triage, triggered from Jira and run on GitHub's machines.
#
# The point of running here rather than on a laptop is that a reporter filing a
# bug at 2am from another timezone gets the same answer as one filing it while
# you happen to have a terminal open. Nothing local has to be awake.
#
# Two ways in, deliberately:
#
#   repository_dispatch  A Jira Automation rule fires the moment a work item is
#                        created and names the issue. This is the fast path -
#                        the comment lands about a minute later, most of which
#                        is GitHub starting a runner.
#
#   schedule             A sweep every 15 minutes that catches anything the
#                        rule missed: automation disabled, GitHub having an
#                        incident, someone moving an item into scope after it
#                        was created. Commenting is idempotent, so the sweep
#                        re-reading an item the rule already handled is a no-op
#                        rather than a duplicate.
#
#   workflow_dispatch    A watcher on request, for a demo or a test session,
#                        polling every 15 seconds for as long as you ask:
#                        `gh workflow run BugTrail -f watch_minutes=20`. See
#                        the watch job for why it is on request rather than
#                        always up.
#
# Setting the Jira rule up is documented in BUGTRAIL.md.
name: BugTrail

on:
  repository_dispatch:
    # watch-cycle is deliberately absent. It was how the resident watcher
    # re-triggered itself, and removing the type is what ends that chain for
    # good: GitHub reads this list from the default branch, so a handover
    # still in flight now arrives and matches nothing.
    types: [jira-issue]
  schedule:
    # Deliberately off the hour. GitHub queues scheduled runs rather than
    # guaranteeing them, and :00 is the most contended minute on the platform -
    # a */15 schedule was observed more than seven minutes late on its first
    # tick. Odd minutes sit in quieter slots. It is still best-effort, so treat
    # this as a backstop and let the dispatch carry the latency requirement.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      key:
        description: "Single issue key, e.g. PLAY-126484 (blank sweeps everything in scope)"
        type: string
        default: ""
      post:
        description: "Actually comment on Jira (otherwise shadow mode)"
        type: boolean
        default: false
      watch_minutes:
        description: "Start a live watcher for this many minutes (0 = one sweep and exit)"
        type: string
        default: "0"

# The scope, declared once. It was repeated across all three invocations
# below, which is the shape that lets a story get retargeted in two places out
# of three - and a half-applied scope fails by commenting on the wrong tickets
# rather than by erroring.
env:
  BUGTRAIL_PARENT: PLAY-126471
  BUGTRAIL_ISSUE_TYPES: Sub-task

jobs:
  triage:
    # A watch request is a different shape of job; it has its own below.
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.watch_minutes || '0') == '0' }}
    runs-on: ubuntu-latest
    # A second run for the same issue would only reach "already commented", so
    # let an in-flight run finish rather than queueing behind itself.
    concurrency:
      group: bugtrail-triage-${{ github.event.client_payload.key || inputs.key || 'sweep' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate the requested issue key
        id: scope
        env:
          # Via the environment, never interpolated into the script body. The
          # payload is whatever the holder of the trigger credential sent, and
          # "${{ ... }}" pasted into a run block is executed by the shell before
          # it is ever a string.
          RAW_KEY: ${{ github.event.client_payload.key || inputs.key }}
        run: |
          if [ -z "${RAW_KEY:-}" ]; then
            echo "target=sweep" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! printf '%s' "$RAW_KEY" | grep -Eq '^[A-Z][A-Z0-9]*-[0-9]+$'; then
            echo "not an issue key: $RAW_KEY" >&2
            exit 1
          fi
          echo "target=$RAW_KEY" >> "$GITHUB_OUTPUT"

      - name: Triage
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          TARGET: ${{ steps.scope.outputs.target }}
          # Shadow mode unless asked: a manual run is usually someone checking
          # what it would say.
          POST: ${{ (github.event_name == 'repository_dispatch' || github.event_name == 'schedule' || inputs.post) && '--post' || '' }}
        run: |
          # --parent is applied whatever the trigger says, so a dispatch naming
          # some unrelated ticket is filtered out by the same rule the sweep
          # uses rather than trusted because it arrived over the API.
          if [ "$TARGET" = "sweep" ]; then
            python3 -u tools/bugtrail/jira_agent.py \
              --parent "$BUGTRAIL_PARENT" \
              --issue-types "$BUGTRAIL_ISSUE_TYPES" \
              --since-days 7 \
              --once $POST
          else
            python3 -u tools/bugtrail/jira_agent.py \
              --parent "$BUGTRAIL_PARENT" \
              --issue-types "$BUGTRAIL_ISSUE_TYPES" \
              --jql "key = $TARGET" \
              --once $POST
          fi

  # A live watcher, started when you want one and lasting as long as you ask.
  #
  # This replaced a resident version that stayed up by dispatching its own
  # successor every 55 minutes. Two things ended that. GitHub stopped handing
  # it runners - one cycle sat queued for 45 minutes, during which the
  # 15-second response time quietly became a 15-minute one and nothing said so
  # - and a permanently resident job is outside what a CI system is for, so it
  # was never going to get more reliable with age.
  #
  # What replaces it fits how the watcher is actually used. Nobody needs one
  # running at 3am; they need one for the ten minutes they are demonstrating or
  # testing, and the cron sweep above already covers the hours in between.
  #
  #     gh workflow run BugTrail -f watch_minutes=20
  #
  # It comments, unlike a manual triage run, which defaults to shadow mode.
  # Starting a watcher is deliberate enough to be taken at its word, and one
  # that watched in silence would look broken.
  watch:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.watch_minutes || '0') != '0' }}
    runs-on: ubuntu-latest
    # The window is enforced in the shell below, where it can report why it
    # ended. This is only the backstop that stops a runner being held if that
    # ever fails to fire.
    timeout-minutes: 310
    concurrency:
      # One watcher at a time. Cancelling rather than queueing means asking for
      # a second replaces the first, instead of leaving two pollers to read the
      # same ticket as unanswered and comment on it twice.
      group: bugtrail-watch
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Watch Jira
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          # Via the environment rather than interpolated into the script, on
          # the same reasoning as the issue key above.
          WATCH_MINUTES: ${{ inputs.watch_minutes }}
        run: |
          minutes="${WATCH_MINUTES:-0}"
          case "$minutes" in
            ''|*[!0-9]*)
              echo "::error::watch_minutes must be a whole number, got '$minutes'"
              exit 1
              ;;
          esac
          # A job is killed at six hours on GitHub's runners. Capping here
          # means an over-long request ends by saying so, rather than being
          # cut off mid-window in a way that reads as a crash.
          if [ "$minutes" -gt 300 ]; then
            echo "::warning::capping watch window at 300 minutes"
            minutes=300
          fi

          echo "watching for ${minutes}m, polling every 15s"
          set +e
          timeout $(( minutes * 60 )) python3 -u tools/bugtrail/jira_agent.py \
            --parent "$BUGTRAIL_PARENT" \
            --issue-types "$BUGTRAIL_ISSUE_TYPES" \
            --watch --interval 15 --post
          code=$?
          set -e

          # 124 is timeout ending the window, which is how a healthy watcher
          # finishes. Any other code is the agent stopping early, and that is
          # a failure worth surfacing rather than a cycle worth completing.
          if [ "$code" -eq 124 ]; then
            echo "watch window of ${minutes}m elapsed"
          else
            echo "::error::watcher exited early with $code"
            exit "$code"
          fi
