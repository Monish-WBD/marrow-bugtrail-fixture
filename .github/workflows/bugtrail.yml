# BugTrail triage, triggered from Jira and run on GitHub's machines.
#
# The point of running here rather than on a laptop is that a reporter filing a
# bug at 2am from another timezone gets the same answer as one filing it while
# you happen to have a terminal open. Nothing local has to be awake.
#
# Two ways in, deliberately:
#
#   repository_dispatch  A Jira Automation rule fires the moment a work item is
#                        created and names the issue. This is the fast path -
#                        the comment lands about a minute later, most of which
#                        is GitHub starting a runner.
#
#   schedule             A sweep every 15 minutes that catches anything the
#                        rule missed: automation disabled, GitHub having an
#                        incident, someone moving an item into scope after it
#                        was created. Commenting is idempotent, so the sweep
#                        re-reading an item the rule already handled is a no-op
#                        rather than a duplicate.
#
#   workflow_dispatch    A watcher on request, for a demo or a test session,
#                        polling every 15 seconds for as long as you ask:
#                        `gh workflow run BugTrail -f watch_minutes=20`. See
#                        the watch job for why it is on request rather than
#                        always up.
#
# Setting the Jira rule up is documented in BUGTRAIL.md.
name: BugTrail

on:
  repository_dispatch:
    types: [jira-issue, watch-cycle]
  schedule:
    # Every five minutes, the tightest interval GitHub accepts, and offset off
    # the hour because :00 is the platform's most contended minute - a */15
    # schedule was once observed seven minutes late on its first tick.
    #
    # This does two jobs now. It sweeps for anything the watcher missed, and
    # it restarts the watcher when the watcher has died, which is what makes
    # the arrangement survivable: see "Keep the watcher alive" below. Five
    # minutes is therefore also the worst case, replacing an unbounded one.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
    inputs:
      key:
        description: "Single issue key, e.g. PLAY-126484 (blank sweeps everything in scope)"
        type: string
        default: ""
      post:
        description: "Actually comment on Jira (otherwise shadow mode)"
        type: boolean
        default: false
      watch_minutes:
        description: "Start a live watcher for this many minutes (0 = one sweep and exit)"
        type: string
        default: "0"

# The scope, declared once. It was repeated across all three invocations
# below, which is the shape that lets a story get retargeted in two places out
# of three - and a half-applied scope fails by commenting on the wrong tickets
# rather than by erroring.
env:
  BUGTRAIL_PARENT: PLAY-126471
  BUGTRAIL_ISSUE_TYPES: Sub-task

jobs:
  triage:
    # A watch request is a different shape of job; it has its own below.
    if: >-
      ${{ github.event.action != 'watch-cycle'
          && (github.event_name != 'workflow_dispatch'
              || (inputs.watch_minutes || '0') == '0') }}
    runs-on: ubuntu-latest
    # A second run for the same issue would only reach "already commented", so
    # let an in-flight run finish rather than queueing behind itself.
    concurrency:
      group: bugtrail-triage-${{ github.event.client_payload.key || inputs.key || 'sweep' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate the requested issue key
        id: scope
        env:
          # Via the environment, never interpolated into the script body. The
          # payload is whatever the holder of the trigger credential sent, and
          # "${{ ... }}" pasted into a run block is executed by the shell before
          # it is ever a string.
          RAW_KEY: ${{ github.event.client_payload.key || inputs.key }}
        run: |
          if [ -z "${RAW_KEY:-}" ]; then
            echo "target=sweep" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! printf '%s' "$RAW_KEY" | grep -Eq '^[A-Z][A-Z0-9]*-[0-9]+$'; then
            echo "not an issue key: $RAW_KEY" >&2
            exit 1
          fi
          echo "target=$RAW_KEY" >> "$GITHUB_OUTPUT"

      - name: Triage
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          TARGET: ${{ steps.scope.outputs.target }}
          # Shadow mode unless asked: a manual run is usually someone checking
          # what it would say.
          POST: ${{ (github.event_name == 'repository_dispatch' || github.event_name == 'schedule' || inputs.post) && '--post' || '' }}
        run: |
          # --parent is applied whatever the trigger says, so a dispatch naming
          # some unrelated ticket is filtered out by the same rule the sweep
          # uses rather than trusted because it arrived over the API.
          if [ "$TARGET" = "sweep" ]; then
            python3 -u tools/bugtrail/jira_agent.py \
              --parent "$BUGTRAIL_PARENT" \
              --issue-types "$BUGTRAIL_ISSUE_TYPES" \
              --since-days 7 \
              --once $POST
          else
            python3 -u tools/bugtrail/jira_agent.py \
              --parent "$BUGTRAIL_PARENT" \
              --issue-types "$BUGTRAIL_ISSUE_TYPES" \
              --jql "key = $TARGET" \
              --once $POST
          fi

      # The watcher's supervisor, and the reason the chain can now be left
      # alone. Previously nothing was responsible for the chain existing: it
      # was started once by hand, so when GitHub declined to give a cycle a
      # runner for 45 minutes the chain simply ended, and the only visible
      # symptom was tickets being answered late by this sweep. A watcher that
      # has stopped looks exactly like a watcher with nothing to do.
      #
      # Every five minutes this asks whether one is alive and starts one if
      # not, which turns a permanent outage into a five-minute gap and makes
      # the chain self-healing rather than something to remember to restart.
      - name: Keep the watcher alive
        if: ${{ github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A dispatch raised with GITHUB_TOKEN does not start a workflow run -
          # GitHub blocks that to stop runs triggering runs - so waking the
          # watcher needs a token of its own.
          CHAIN_TOKEN: ${{ secrets.CHAIN_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # Runs are counted alive only if they started recently. A cycle is
          # capped at 55 minutes, so anything older is finished whatever the
          # API says - and it does sometimes say otherwise: a run has been
          # seen stuck reporting in_progress after its jobs completed, which
          # without this window would look like a healthy watcher forever and
          # suppress every restart.
          cutoff=$(date -u -d '70 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          alive=$(gh api "repos/$REPO/actions/runs?event=repository_dispatch&per_page=50" \
            --jq "[.workflow_runs[]
                   | select(.display_title == \"watch-cycle\")
                   | select(.status == \"in_progress\" or .status == \"queued\")
                   | select(.run_started_at > \"$cutoff\")] | length")

          if [ "${alive:-0}" -gt 0 ]; then
            echo "watcher alive ($alive run(s)); nothing to do"
            exit 0
          fi

          if [ -z "${CHAIN_TOKEN:-}" ]; then
            # A warning, not a failure. The sweep above already answered the
            # tickets, and failing the run would hide that behind a red cross.
            echo "::warning::No watcher running and CHAIN_TOKEN is unset, so it cannot be restarted."
            exit 0
          fi

          echo "no watcher running; starting one"
          curl -sS -f -X POST \
            -H "Authorization: Bearer $CHAIN_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/dispatches" \
            -d '{"event_type":"watch-cycle"}'

  # The watcher: polls Jira every 15 seconds and comments as work items appear.
  #
  # It runs permanently, in 55-minute cycles that each dispatch a successor.
  # The cycle exists because a job cannot outlive the runner it is on, so
  # "permanent" here means a chain of cycles rather than one long process.
  #
  # Two things went wrong with the first version of this, and both are
  # addressed rather than papered over:
  #
  #   Runner starvation  A cycle sat queued 45 minutes with no runner, which
  #                      ended the chain silently - nothing owned the question
  #                      of whether a watcher existed. The scheduled sweep now
  #                      restarts it within five minutes; see "Keep the
  #                      watcher alive" above.
  #
  #   Cancellation       Handover ran on always(), which includes cancellation.
  #                      Since the only thing that cancels a cycle is its own
  #                      replacement, each cancellation left two chains rather
  #                      than one, and two pollers can both read a ticket as
  #                      unanswered and comment on it twice.
  #
  # It also takes a window on request, for a demo or a test session, which
  # runs once and does not chain:
  #
  #     gh workflow run BugTrail -f watch_minutes=20
  #
  # Either way it comments, unlike a manual triage run, which defaults to
  # shadow mode. Starting a watcher is deliberate enough to be taken at its
  # word, and one that watched in silence would look broken.
  watch:
    if: >-
      ${{ github.event.action == 'watch-cycle'
          || (github.event_name == 'workflow_dispatch'
              && (inputs.watch_minutes || '0') != '0') }}
    runs-on: ubuntu-latest
    # The window is enforced in the shell below, where it can report why it
    # ended. This is only the backstop that stops a runner being held if that
    # ever fails to fire.
    timeout-minutes: 310
    concurrency:
      # One watcher at a time. Cancelling rather than queueing means asking for
      # a second replaces the first, instead of leaving two pollers to read the
      # same ticket as unanswered and comment on it twice.
      group: bugtrail-watch
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Watch Jira
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          # Via the environment rather than interpolated into the script, on
          # the same reasoning as the issue key above.
          WATCH_MINUTES: ${{ inputs.watch_minutes }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          # A chain cycle runs 55 minutes: comfortably inside GitHub's six-hour
          # job limit, and short enough that a stuck cycle is not a long
          # outage. A requested window runs for exactly as long as was asked.
          if [ "${EVENT_ACTION:-}" = "watch-cycle" ]; then
            minutes=55
          else
            minutes="${WATCH_MINUTES:-0}"
          fi
          case "$minutes" in
            ''|*[!0-9]*)
              echo "::error::watch_minutes must be a whole number, got '$minutes'"
              exit 1
              ;;
          esac
          # A job is killed at six hours on GitHub's runners. Capping here
          # means an over-long request ends by saying so, rather than being
          # cut off mid-window in a way that reads as a crash.
          if [ "$minutes" -gt 300 ]; then
            echo "::warning::capping watch window at 300 minutes"
            minutes=300
          fi

          # Read by the handover step to floor the cycle length. Steps do not
          # share shell variables, so it goes through the environment file.
          echo "STARTED=$(date +%s)" >> "$GITHUB_ENV"

          echo "watching for ${minutes}m, polling every 15s"
          set +e
          timeout $(( minutes * 60 )) python3 -u tools/bugtrail/jira_agent.py \
            --parent "$BUGTRAIL_PARENT" \
            --issue-types "$BUGTRAIL_ISSUE_TYPES" \
            --watch --interval 15 --post
          code=$?
          set -e

          # 124 is timeout ending the window, which is how a healthy watcher
          # finishes. Any other code is the agent stopping early, and that is
          # a failure worth surfacing rather than a cycle worth completing.
          if [ "$code" -eq 124 ]; then
            echo "watch window of ${minutes}m elapsed"
          else
            echo "::error::watcher exited early with $code"
            exit "$code"
          fi

      - name: Hand over to the next cycle
        # Only a chain cycle continues the chain. A requested window is a
        # one-off, and having it hand over would quietly convert "watch for
        # twenty minutes" into a permanent second chain nobody asked for.
        #
        # Runs even when the watch step failed, since a transient Jira outage
        # should not end the chain - but deliberately not on always(), which
        # also covers cancellation. The only thing that cancels a cycle is its
        # replacement arriving through the concurrency group, so handing over
        # from a cancelled run adds a chain rather than continuing one, and
        # every cancellation doubles the watchers instead of holding them at
        # one. Two were seen running together for exactly this reason.
        #
        # It also means cancelling the run in flight is a working way to stop
        # the chain, though the sweep will start a new one within five minutes
        # unless the workflow is disabled too.
        if: ${{ github.event.action == 'watch-cycle' && !cancelled() }}
        env:
          # Not GITHUB_TOKEN: events raised with it do not start workflow runs.
          CHAIN_TOKEN: ${{ secrets.CHAIN_TOKEN }}
        run: |
          if [ -z "${CHAIN_TOKEN:-}" ]; then
            echo "::error::CHAIN_TOKEN is missing, so the chain ends here."
            exit 1
          fi
          # A crash on startup - bad credentials, say - would otherwise chain
          # at full speed. Hold the floor so a broken chain stays slow enough
          # to notice and stop.
          elapsed=$(( $(date +%s) - ${STARTED:-0} ))
          if [ "${STARTED:-0}" -gt 0 ] && [ "$elapsed" -lt 300 ]; then
            echo "cycle ended after ${elapsed}s; holding before handing over"
            sleep $(( 300 - elapsed ))
          fi
          curl -sS -f -X POST \
            -H "Authorization: Bearer $CHAIN_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/dispatches" \
            -d '{"event_type":"watch-cycle"}'
          echo "next cycle dispatched"
